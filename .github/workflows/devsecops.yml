name: "DevSecOps Pipeline"
on: [push, pull_request]

env:
  NODE_VERSION: 20
  TRUFFLEHOG_VERSION: v3.64.0
  GCP_REGION: asia-southeast2
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  ARTIFACT_REGISTRY: "asia-southeast2-docker.pkg.dev/syafiq-devsecops-playground/devsecops-repo"

jobs:
  pre-checks:
    name: "🏗️ Security Pre-Checks"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
        
      - name: "🛡️ Node.js Setup"
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: "📦 npm Audit"
        continue-on-error: true
        run: npm audit --production --json > audit-results.json  # Save as JSON

      - name: "📤 Upload npm audit results"
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit-results.json
      
      - name: "☕ Setup Java"
        uses: actions/setup-java@v3
        with:
          java-version: '17'


  sast:
    name: "🔍 SAST Analysis"
    runs-on: ubuntu-latest
    needs: pre-checks
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "⚙️ Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: javascript  

      - name: "🔎 Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results.sarif  

  secret_scanning:
    name: "🔑 Secret Scanning"
    runs-on: ubuntu-latest
    needs: pre-checks
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: "🕵️♂️ Run TruffleHog"
        uses: trufflesecurity/trufflehog-github-action@main
        with:
          path: .  
          format: json
          output: trufflehog-results.json
        continue-on-error: true

      - name: "📤🔒 Upload TruffleHog Results"
        uses: actions/upload-artifact@v3
        with:
          name: trufflehog-results
          path: trufflehog-results.json

  container_security:
    name: "🐳 Build and Scan Docker Image"
    runs-on: ubuntu-latest
    #needs: [sast, secret_scanning]
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🛠️ Build Docker Image"
        run: docker build -t ${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }} .  # Update ni

      - name: "🛡️ Run Trivy Scan"
        uses: aquasecurity/trivy-action@0.19.0
        with:
          image-ref: ${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }}
          format: 'json'
          output: trivy-results.json
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      - name: " 📤🔒 Upload Trivy Results"
        uses: actions/upload-artifact@v3
        with:
          name: trivy-scan-results
          path: trivy-results.json

      - name: "🔐 Auth to GCP"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: "☁️ Setup GCloud SDK"
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: latest
          
      - name: "🏷️ Tag and Push Image"
        run: |
          docker push "${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }}"
          docker tag "${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }}" "${{ env.ARTIFACT_REGISTRY }}:latest"
          docker push "${{ env.ARTIFACT_REGISTRY }}:latest"
        env:
          ARTIFACT_REGISTRY: ${{ env.ARTIFACT_REGISTRY }}

  deploy_staging:
    name: "🚀 Deploy to Staging"
    runs-on: ubuntu-latest
    needs: container_security
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@main
        with:
          allow_unauthenticated: true
          service: juice-shop-staging
          image: ${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }}
          region: ${{ env.GCP_REGION }}
          port: 3000

  dast:
    name: "🔦 DAST Scan"
    runs-on: ubuntu-latest
    needs: deploy_staging
    steps:
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: https://juice-shop-staging-270653895788.asia-southeast2.run.app/#/
          rules_file_name: "zap-baseline.conf"  # Optional custom rules
          
      - name: Upload DAST Results
        uses: actions/upload-artifact@v3
        with:
          name: zap-scan-results
          path: zap-results.*

  notify:
    name: "📢 Notification"
    needs: [container_security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "📤 Send Results to Defect Dojo"
        run: echo "Implement Defect Dojo integration"  # Temporary placeholder