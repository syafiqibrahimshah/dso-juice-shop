name: "DevSecOps Pipeline"
on: [push, pull_request]

env:
  NODE_VERSION: 20
  TRUFFLEHOG_VERSION: v3.64.0
  GCP_REGION: asia-southeast2
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  ARTIFACT_REGISTRY: "asia-southeast2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devsecops-repo/juice-shop"

jobs:
  pre-checks:
    name: "🏗️ Security Pre-Checks"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
        
      - name: "🛡️ Node.js Setup"
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: "📦 npm Audit"
        continue-on-error: true
        run: npm audit --production --json > audit-results.json  # Save as JSON

      - name: "📤 Upload npm audit results"
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit-results.json

  sast:
    name: "🔍 SAST Analysis"
    runs-on: ubuntu-latest
    needs: pre-checks
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "⚙️ Initialize CodeQL"
        uses: github/codeql-action/init@v3
        with:
          languages: javascript  

      - name: "🔎 Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results.sarif  

  secret_scanning:
    name: "🔑 Secret Scanning"
    runs-on: ubuntu-latest
    needs: pre-checks
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: "🕵️♂️ Run TruffleHog"
        uses: trufflesecurity/trufflehog@main
        with:
          paths: .  
          output: json://trufflehog-results.json 
        env:
          CUSTOM_REGEX: |
            (?i)(
              # Standard patterns
              password|token|secret|jwt|private[\s_-]?key|
              # GCP specific
              (gcp|google)_(api|service|cloud)_key| 
              syafiq-devsecops.*\.json|  # Match project-specific service accounts
              # Internal patterns
              (internal|syafiq)_(db|api)_(prod|staging)|
              # Env files
              \.env\.(local|prod|test)
            )
        continue-on-error: true

      - name: "📤🔒 Upload TruffleHog Results"
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json

  sca:
    name: "🔮 SCA with Snyk"
    runs-on: ubuntu-latest
    needs: [pre-checks]
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🛡️ Node.js Setup"
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📦 Install Snyk"
        run: npm install -g snyk

      - name: "🔍 Run Snyk Security Scan"
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          command: test
          args: --all-projects --json-file-output=snyk-results.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: "📤 Upload Snyk Results"
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sca-results
          path: snyk-results.json

  container_security:
    name: "🐳 Build, Scan and Push Image"
    runs-on: ubuntu-latest
    needs: [sast, secret_scanning]
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🔐 Auth to GCP"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: "☁️ Setup GCloud"
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: latest
          
      - name: "🔑 Configure Docker Auth"
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: "🛠️ Build Docker Image"
        run: docker build -t ${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }} .

      - name: "🛡️ Run Trivy Scan"
        uses: aquasecurity/trivy-action@0.19.0
        with:
          image-ref: ${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }}
          format: 'json'
          output: trivy-results.json
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      - name: " 📤🔒 Upload Trivy Results"
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json

      - name: "🏷️ Tag and Push Image"
        run: |
          docker push "${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }}"
          docker tag "${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }}" "${{ env.ARTIFACT_REGISTRY }}:latest"
          docker push "${{ env.ARTIFACT_REGISTRY }}:latest"
        env:
          ARTIFACT_REGISTRY: ${{ env.ARTIFACT_REGISTRY }}

  deploy_staging:
    name: "🚀 Deploy to Staging"
    runs-on: ubuntu-latest
    needs: [pre-checks,container_security,secret_scanning]
    outputs:
      service_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: "🔐 Auth to GCP"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: "☁️ Setup GCloud"
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: latest
      
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: juice-shop-staging
          image: ${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          allow_unauthenticated: true
          port: 3000
          flags: "--min-instances=1 --max-instances=3"

  dast:
    name: "🔦 DAST Scan"
    runs-on: ubuntu-latest
    needs: deploy_staging
    steps:
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: ${{ needs.deploy_staging.outputs.service_url }}
          rules_file_name: "zap-baseline.conf"
      
      - name: Upload DAST Results
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-results
          path: zap-results.*

  notify:
    name: "📢 [PLACEHOLDER] Notification"
    needs: [pre-checks,container_security,secret_scanning,dast]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "📤 Send Results to Defect Dojo"
        run: echo "Implement Defect Dojo integration"

  deploy_prod:
    name: "🚀 [PLACEHOLDER] Deploy to Prod"
    runs-on: ubuntu-latest
    needs: [dast]
    if: false  # 👈 Disable sementara
    steps:
      - name: "📝 Implement Prod Deployment"
        run: echo "Production deployment logic goes here"