name: "DevSecOps Pipeline"
on: [push, pull_request]

env:
  NODE_VERSION: 20
  TRUFFLEHOG_VERSION: v3.64.0
  GCP_REGION: asia-southeast2
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  ARTIFACT_REGISTRY: "asia-southeast2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devsecops-repo/juice-shop"

jobs:
  install_audit:
    name: "🏗️ Pre-checks: Install and Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node Modules
        uses: actions/cache@v4
        with: 
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install Dependencies
        run: npm install

      - name: npm Audit
        continue-on-error: true
        run: npm audit --omit=dev --json > audit-results.json

      - name: Upload npm audit results
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit-results.json

  unit_test:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    needs: install_audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install

      - name: Install CLI Tools
        run: npm install -g @angular/cli@$ANGULAR_CLI_VERSION
      
      - name: Run Unit Tests
        run: npm test -- --reporter json --reporter-option output=test-results.json

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results.json

  sast_scan:
    name: "🔍 SAST Analysis"
    runs-on: ubuntu-latest
    needs: install_audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript  

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results.sarif  

  secret_scan:
    name: "🔑 Secret Scanning"
    runs-on: ubuntu-latest
    needs: install_audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          paths: .  
          output: json://trufflehog-results.json 
        env:
          CUSTOM_REGEX: |
            (?i)(
              # Standard patterns
              password|token|secret|jwt|private[\s_-]?key|
              # GCP specific
              (gcp|google)_(api|service|cloud)_key| 
              syafiq-devsecops.*\.json|  # Match project-specific service accounts
              # Internal patterns
              (internal|syafiq)_(db|api)_(prod|staging)|
              # Env files
              \.env\.(local|prod|test)
            )
        continue-on-error: true

      - name: Upload TruffleHog Results
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json

  sca_scan:
    name: "🔮 SCA with Snyk"
    runs-on: ubuntu-latest
    needs: install_audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Node.js Setup
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install

      - name: Install Snyk
        run: npm install -g snyk

      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          command: test
          args: --all-projects --json-file-output=snyk-results.json --detection-depth=5 --dev
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          DEBUG: "snyk*"

      - name: Upload Snyk Results
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sca-results
          path: snyk-results.json
  
  build_scan_push:
    name: "🏗️ Build, Scan and Push Image"
    runs-on: ubuntu-latest
    needs: [unit_test,sast_scan, secret_scan, sca_scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: latest
          
      - name: Configure Docker Auth
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build Docker Image
        run: docker build -t ${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }} .

      - name: "Scan Image"
        uses: aquasecurity/trivy-action@0.19.0
        with:
          image-ref: ${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }}
          format: 'json'
          output: trivy-results.json
          severity: 'HIGH,CRITICAL'
          continue-on-error: true

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json

      - name: Tag and Push Image
        run: |
          docker push "${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }}"
          docker tag "${{ env.ARTIFACT_REGISTRY }}:${{ github.run_id }}" "${{ env.ARTIFACT_REGISTRY }}:latest"
          docker push "${{ env.ARTIFACT_REGISTRY }}:latest"
        env:
          ARTIFACT_REGISTRY: ${{ env.ARTIFACT_REGISTRY }}

  deploy:
    name: "🚀 Deploy"
    runs-on: ubuntu-latest
    needs: [build_scan_push]
    outputs:
      service_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: latest
      
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          region: ${{ env.GCP_REGION }}
          service: juice-shop
          source: .
          flags: --port=3000 --allow-unauthenticated

  dast_scan:
    name: "🔦 ZAP Scan"
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: ${{ needs.deploy_staging.outputs.service_url }}
          rules_file_name: "zap-baseline.conf"
          cmd_options: "-J -j -d -a -m 5"
            
      - name: Upload DAST Results
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-results
          path: |
            report_html.html

  report:
    name: "🚨 Reporting"
    needs: [dast_scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Results to Defect Dojo
        run: echo "Implement Defect Dojo integration"